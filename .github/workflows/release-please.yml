name: release-please

on:
  push:
    branches:
      - main # Or your default branch

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # This creates the Release PR and handles versioning
          release-type: node
          package-name: arvfit-frontend
